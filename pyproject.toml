[project]
name = "agent-skills"
version = "0.1.0"
description = "Agent skills for Claude Code, Codex and Pi, with deterministic gates."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-impacted>=0.37.0",
    "pytest-xdist>=3.6",
    "PyYAML>=6.0",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "skills"]
# `--strict-markers` turns an unknown marker into an error; `--import-mode=importlib` lets two
# skills carry a file with the same name. The default selection (the unit tests) lives in
# `conftest.py`, so that naming a file runs that file's tests whatever their marker.
addopts = '--strict-markers --import-mode=importlib'
markers = [
    "unit: in process and deterministic, no subprocess, no server, no network; it may read the repository and write only inside its own temporary directory; a temporary directory is not a boundary (the fast suite)",
    "integration: drives a real component boundary (a subprocess, an IPC pipe, a server, the network, a database); a temporary directory is not one",
]
filterwarnings = [
    # A leaked file or stream is a bug in the test or in the code under test, not a warning to hide.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

# The affected check tier (`pytest --impacted`, .orchestrate/config.yaml). The skills' scripts run
# as files, not imports, so import analysis selects no test for a change to one: the map routes each
# source to its tests. Globs are right-anchored and `*` is one segment; test_check_tiers_repo checks
# every script is covered.
impacted_module = "scripts"
impacted_map = [
    "conftest.py=tests",
    "scripts/*=tests",
    "skills/excalidraw/scripts/*=tests",
    "skills/explain-video/scripts/*=tests",
    "skills/idea-frame/scripts/*=skills/idea-frame/tests",
    "skills/orchestrate/scripts/*=skills/orchestrate/tests",
    "skills/start-planning/scripts/*=skills/start-planning/tests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # Formatting is not enforced.
